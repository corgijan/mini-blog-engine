<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Corgijans Rezepte</title>
    <script src="/static/script.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/favicon.png">
    <style>
        * { font-size: 20px; color: #E9C46A; font-family: "Helvetica", sans-serif; }
        body{ background: #264653;margin:0; }
        .add { color: #E9C46A !important; }
        img { width: 100%; height: auto; }
        a { color: #E9C46A; }
        a:visited, .home { color: #F4A261; }
        textarea, input {
            background: #2A9D8F;
            border: 3px solid #264653;
        }
        main { padding: 20px; max-width: 600px; margin:auto; }
        img {max-width:300px;max-height:300px;}
        details{
            padding:40px 0 40px 0;
            background: #2A9D8F;
            width: 500px;
            border-radius: 15px;
        }
        #recipesList{max-height: 60vh;overflow-y: scroll}
        .pre{ white-space: pre-wrap; }
        .norm{ background: #264653; border: 0px; text-decoration: underline; }
        .nav-link{ font-size:1rem; }

    </style>
</head>

<main style="padding-top:100px">
    <nav style="font-size: 1rem" class="navbar navbar-expand-xl fixed-top navbar-custom top-nav-regular navbar-dark"><a
            class="navbar-brand" href="/">🦊 corgijans Rezepte</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#main-navbar"
                aria-controls="main-navbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="main-navbar">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/e/new">hinzufügen</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="http://blog.corgijan.dev">blog</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://blog.corgijan.dev/impressum">impressum</a>
                </li>
            </ul>
        </div>
        <div class="avatar-container">
            <div class="avatar-img-border">
                <a href="/">
                    <img alt="Navigation bar avatar" class="avatar-img"
                         src="http://blog.corgijan.dev/assets/images/ava.jpg">
                </a>
            </div>
        </div>

    </nav>
    {% block content %}
    {% endblock %}

</main>
</html>
